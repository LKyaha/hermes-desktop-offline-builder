name: Windows x64 upstream build smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Optional upstream tag / branch / commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Resolve upstream Hermes ref
        id: upstream
        shell: pwsh
        env:
          REQUESTED_REF: ${{ github.event.inputs.hermes_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = $env:REQUESTED_REF
          if ([string]::IsNullOrWhiteSpace($ref)) {
            try {
              $headers = @{ 'User-Agent' = 'hermes-desktop-offline-builder' }
              $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/NousResearch/hermes-agent/releases/latest'
              $ref = $release.tag_name
            } catch {
              Write-Warning "Could not resolve latest release; falling back to main: $($_.Exception.Message)"
              $ref = 'main'
            }
          }
          "ref=$ref" >> $env:GITHUB_OUTPUT
          $safeRef = $ref -replace '[\\/:*?"<>|]', '-'
          "safe_ref=$safeRef" >> $env:GITHUB_OUTPUT
          Write-Host "Using upstream ref: $ref"

      - name: Clone Hermes upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git upstream
          Set-Location upstream
          git fetch --tags --force
          git checkout '${{ steps.upstream.outputs.ref }}'
          $sha = git rev-parse HEAD
          "HERMES_COMMIT=$sha" >> $env:GITHUB_ENV
          Write-Host "Hermes commit: $sha"

      - name: Setup Node 22.22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version

      - name: Install upstream workspace dependencies
        working-directory: upstream
        shell: pwsh
        env:
          npm_config_engine_strict: 'false'
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Warning "npm ci failed with exit $code; retrying with npm install to mirror the official installer fallback."
            npm install
            $code = $LASTEXITCODE
          }
          if ($code -ne 0) {
            throw "Workspace dependency installation failed with exit $code"
          }

      - name: Build Hermes Desktop using official bootstrap path
        working-directory: upstream/apps/desktop
        shell: pwsh
        env:
          npm_config_engine_strict: 'false'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run pack
          if ($LASTEXITCODE -ne 0) {
            throw "npm run pack failed with exit $LASTEXITCODE"
          }

      - name: Verify unpacked Hermes executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'upstream/apps/desktop/release/*-unpacked/Hermes.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host 'Release directory contents:'
            Get-ChildItem 'upstream/apps/desktop/release' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw 'Desktop build completed but no Hermes.exe was found under release/*-unpacked/.'
          }
          "HERMES_DESKTOP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "HERMES_DESKTOP_DIR=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
          Write-Host "Hermes desktop executable: $($exe.FullName)"

      - name: Collect smoke artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = "out/Hermes-Desktop-${{ steps.upstream.outputs.safe_ref }}-win-x64-unpacked.zip"
          Compress-Archive -Path "$env:HERMES_DESKTOP_DIR/*" -DestinationPath $zip -CompressionLevel Optimal

          $info = [ordered]@{
            upstream = 'NousResearch/hermes-agent'
            ref = '${{ steps.upstream.outputs.ref }}'
            commit = $env:HERMES_COMMIT
            platform = 'windows'
            arch = 'x64'
            build_mode = 'npm run pack / electron-builder --dir'
            purpose = 'upstream desktop build smoke test; not the final offline installer'
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 'out/build-info.json'

          Get-ChildItem out/* | Where-Object { -not $_.PSIsContainer -and $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Add-Content 'out/SHA256SUMS.txt'
          }

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-x64-upstream-smoke-${{ steps.upstream.outputs.safe_ref }}
          path: out/*
          retention-days: 7
