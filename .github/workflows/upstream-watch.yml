name: Hermes upstream release watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/publish-validated-release.yml'
      - '.github/contract/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-upstream-release-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current builder revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve latest stable upstream release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream_ref="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)"
          if [[ -z "$upstream_ref" || "$upstream_ref" == 'null' ]]; then
            echo 'Could not resolve the latest NousResearch/hermes-agent stable release.' >&2
            exit 1
          fi

          upstream_sha="$(gh api "repos/NousResearch/hermes-agent/commits/$upstream_ref" --jq .sha)"
          if [[ -z "$upstream_sha" || ${#upstream_sha} -lt 12 ]]; then
            echo "Could not resolve commit for upstream release $upstream_ref." >&2
            exit 1
          fi

          echo "ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable release: $upstream_ref"
          echo "Upstream commit: $upstream_sha"

      - name: Gate on upstream installer contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail

          installer="$RUNNER_TEMP/hermes-install.ps1"
          summary="$RUNNER_TEMP/hermes-contract-summary.md"

          gh api "repos/NousResearch/hermes-agent/contents/scripts/install.ps1?ref=$UPSTREAM_REF"             --jq .content | base64 --decode > "$installer"

          set +e
          python3 .github/contract/check-installer-contract.py             --installer "$installer"             --contract .github/contract/hermes-installer-contract.json             --upstream-ref "$UPSTREAM_REF"             --summary "$summary"
          gate_code=$?
          set -e

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$gate_code" != '0' ]]; then
            echo "Upstream installer contract changed for $UPSTREAM_REF; refusing to allocate the Windows runner." >&2
            echo "Review the contract summary, update the offline adapter if needed, then deliberately update the accepted contract baseline." >&2
            exit "$gate_code"
          fi

      - name: Resolve desired immutable release and dispatch only when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail

          builder_sha="$(git rev-parse HEAD)"
          builder_id="$({
            git ls-tree -r HEAD -- .github/workflows/offline-build.yml scripts installer
          } | sha256sum | cut -c1-12)"
          if [[ -z "$builder_id" ]]; then
            echo 'Could not compute builder content fingerprint.' >&2
            exit 1
          fi

          safe_ref="$(printf '%s' "$UPSTREAM_REF" | sed 's#[\\/:*?"<>|]#-#g')"
          release_tag="offline-${safe_ref}-u${UPSTREAM_SHA:0:12}-b${builder_id}"

          echo "Builder commit: $builder_sha"
          echo "Builder content fingerprint: $builder_id"
          echo "Expected immutable release: $release_tag"

          existing="$(gh api "repos/$GH_REPO/releases/tags/$release_tag" 2>/dev/null || true)"
          if [[ -n "$existing" && "$(jq -r '.draft' <<<"$existing")" == 'false' ]]; then
            echo 'The exact validated upstream+builder release already exists. No Windows runner needed.'
            exit 0
          fi

          active_runs="$(gh run list --workflow offline-build.yml --branch main --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "$active_runs" != '0' ]]; then
            echo "A full Windows build is already active ($active_runs run(s)); not dispatching a duplicate."
            exit 0
          fi

          echo 'Contract accepted and exact validated release is missing; dispatching full Windows validation/build.'
          gh workflow run offline-build.yml             --ref main             -f hermes_ref="$UPSTREAM_REF"
