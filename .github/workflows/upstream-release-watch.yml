name: Watch upstream Hermes releases
# retrigger after runtime layout fix

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-release-watch.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-hermes-release-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Detect latest stable upstream release and dispatch missing build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream_json="$(gh api repos/NousResearch/hermes-agent/releases/latest)"
          upstream_tag="$(jq -r '.tag_name' <<<"$upstream_json")"
          is_draft="$(jq -r '.draft' <<<"$upstream_json")"
          is_prerelease="$(jq -r '.prerelease' <<<"$upstream_json")"

          if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
            echo 'Could not resolve the latest upstream release tag.' >&2
            exit 1
          fi
          if [[ "$is_draft" != "false" || "$is_prerelease" != "false" ]]; then
            echo "Latest upstream release is not stable: $upstream_tag (draft=$is_draft prerelease=$is_prerelease)"
            exit 0
          fi

          safe_ref="$(printf '%s' "$upstream_tag" | sed 's#[\\/:*?"<>|]#-#g')"
          release_tag="offline-${safe_ref}"

          echo "Latest stable upstream release: $upstream_tag"
          echo "Expected builder release: $release_tag"

          if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Already published; nothing to do."
            exit 0
          fi

          # Avoid spawning a duplicate heavy Windows build when a prior watcher
          # invocation already dispatched the same upstream ref and is still
          # queued/in progress. Failed/cancelled runs are intentionally ignored
          # so the next 6-hour check retries automatically.
          active_count="$(gh run list \
            --repo "$GH_REPO" \
            --workflow offline-build.yml \
            --limit 20 \
            --json status,event,displayTitle \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") and .event == "workflow_dispatch")] | length')"
          if [[ "$active_count" != "0" ]]; then
            echo "A dispatched full offline build is already active; skipping this check."
            exit 0
          fi

          echo "No validated offline release exists for $upstream_tag; dispatching full Windows build + publish."
          gh workflow run offline-build.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f hermes_ref="$upstream_tag" \
            -f publish=true

          echo "Dispatched offline-build.yml for $upstream_tag."
